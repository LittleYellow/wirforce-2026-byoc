<style>
:root{
  /* WirForce 2026 主視覺：墨綠打底、螢光黃當強調色（取自 wirforce.com.tw） */
  --sheet:#012B1E;      /* 墨綠，官網面積最大的底色 */
  --paper:#0D2E24;      /* 卡片、輸入框 */
  --ink:#F0FFE8;        /* 主要文字，對比 14.8 */
  --muted:#9CBCA9;      /* 次要文字，對比 7.5 */
  --line:#2A6149;
  --seat:#FFFF01;       /* 螢光黃，官網 CTA 用色 */
  --seat-ink:#19232A;   /* 螢光黃上的深色字，對比 14.9 */
  --hit:#D4FF00;
  --radius:2px;         /* 官網按鈕是直角，這裡收到 2px 保留銳利感 */
  color-scheme:dark;
  --id-font:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body-font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* 官網本身就只有深色一套，這裡跟著走，不另外做淺色版 */
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--sheet);color:var(--ink);font:16px/1.6 var(--body-font);-webkit-text-size-adjust:100%}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}

header h1{font-family:var(--id-font);font-weight:800;font-size:clamp(34px,9vw,56px);line-height:.95;margin:8px 0 4px;letter-spacing:.5px}
header h1 span{display:block;font-family:var(--body-font);font-weight:700;font-size:.42em;letter-spacing:0;margin-top:6px}
header p{margin:6px 0 18px;color:var(--muted);font-size:14px}

.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);padding:8px 0 12px}
.search label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.search input{width:100%;font:500 20px/1.3 var(--body-font);color:var(--ink);background:var(--paper);
  border:2px solid var(--ink);border-radius:var(--radius);padding:14px 16px;outline:none}
.search input:focus-visible{box-shadow:0 0 0 3px var(--hit)}
.status{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.4em}

/* 查詢結果：座位票根 */
.ticket{display:grid;grid-template-columns:auto 1fr;background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);margin:14px 0;overflow:hidden}
.stub{background:var(--seat);color:var(--seat-ink);padding:14px 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;min-width:112px;border-right:2px dashed var(--seat-ink)}
.stub .id{font:800 52px/1 var(--id-font)}
.stub .sub{font-size:13px;margin-top:4px;opacity:.9}
.info{padding:14px 16px;min-width:0}
.info .name{font-size:22px;font-weight:700;overflow-wrap:anywhere;margin:0}
.info .name.empty{color:var(--muted);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}
.tag{font-size:13px;border:1.5px solid var(--ink);border-radius:999px;padding:1px 10px}
.near{margin:0;padding:0;list-style:none;font-size:15px}
.near li{display:flex;gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.near li:first-child{border-top:0}
.near b{flex:0 0 3.5em;color:var(--muted);font-weight:500}
.near button,.near a{all:unset;cursor:pointer;color:inherit;text-decoration:underline;text-underline-offset:3px}
.near button:focus-visible,.near a:focus-visible{outline:2px solid var(--hit);outline-offset:2px}

/* 座位獨立頁（/seat/A0024）的「介紹與活動」，內容來自原表的備註欄 */
.seat-about{grid-column:1/-1;border-top:1.5px solid var(--line);padding:12px 16px}
.seat-about h3{margin:0 0 8px;font:500 13px/1 var(--body-font);color:var(--muted);letter-spacing:1px}
.seat-about .note+.note{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.seat-about .about{margin:0;font-size:15px;overflow-wrap:anywhere;white-space:pre-line}
.seat-about .by{margin:4px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.seat-about .none{margin:0;font-size:14px;color:var(--muted)}
.seat-about .row{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;margin-top:8px}
.seat-about .src{margin-top:0}
.linkbtn{all:unset;cursor:pointer;font:500 13px/1 var(--body-font);color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;padding:7px 12px}
.linkbtn:focus-visible{outline:2px solid var(--hit);outline-offset:1px}
/* 分享是這一頁的主要動作，用螢光黃；複製連結退成次要 */
.linkbtn.share{background:var(--seat);color:var(--seat-ink);border-color:var(--seat);font-weight:700}
.plainlink{flex:1 1 220px;min-width:0;font:400 13px/1.3 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color:var(--ink);background:var(--sheet);border:1.5px solid var(--line);border-radius:var(--radius);padding:7px 10px}

/* 同桌小地圖：照原表的樣子畫 */
.table-map{grid-column:1/-1;border-top:2px solid var(--ink);padding:10px 0 12px;background:var(--sheet)}
.table-map h3{font-size:13px;font-weight:500;color:var(--muted);margin:0 16px 8px}
.scroller{overflow-x:auto;padding:0 16px 4px;scrollbar-width:thin}
.grid{display:grid;gap:2px;width:max-content}
.cell{font:600 15px/1 var(--id-font);text-align:center;padding:6px 0;width:64px;color:var(--seat-ink);background:var(--seat);border:1px solid rgba(0,0,0,.25)}
.nm{font-size:12px;line-height:1.25;text-align:center;padding:4px 2px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.aisle{height:2px;background:var(--line);margin:1px 0}
.cell.hit{outline:3px solid var(--hit);outline-offset:-1px;position:relative;z-index:1}
.nm.hit{font-weight:700;color:var(--hit)}

/* 全區地圖（相對位置圖，不是按實際場地比例畫的） */
[hidden]{display:none!important}
.mapbar{margin:10px 0 0}
.btn{font:500 15px/1 var(--body-font);cursor:pointer;background:var(--paper);color:var(--ink);
  border:1.5px solid var(--ink);border-radius:999px;padding:9px 16px}
.btn[disabled]{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid var(--hit)}
.mapwrap{margin:12px 0 0;background:var(--paper);border:2px solid var(--ink);border-radius:var(--radius);overflow:hidden}
.maptools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-bottom:1.5px solid var(--line)}
.zoom{display:flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.zoom button{all:unset;cursor:pointer;font:500 14px/1 var(--body-font);padding:8px 14px;min-width:44px;text-align:center}
.zoom button+button{border-left:1.5px solid var(--ink)}
.zoom button.on{background:var(--ink);color:var(--paper)}
.zoom button:focus-visible{outline:2px solid var(--hit);outline-offset:-2px}
.jump{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 100%}
.jump button{all:unset;cursor:pointer;font:500 13px/1 var(--body-font);color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;min-width:40px;text-align:center}
.jump button:focus-visible{outline:2px solid var(--hit);outline-offset:1px}
.legend{margin:0;font-size:12px;color:var(--muted);flex:1 1 100%}
.legend b{font-weight:500;color:var(--ink)}
.mapscroll{overflow:auto;max-height:min(52vh,520px);padding:10px 12px;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.mapgrid{display:grid;position:relative;width:max-content;gap:1px;--cell:8px;--gap:3px}
.mapgrid .s{background:var(--c0);color:var(--muted);border-radius:1px;font:600 10px/1 var(--id-font);
  display:flex;align-items:center;justify-content:center;overflow:hidden;min-width:0;cursor:pointer}
.mapgrid .s.on{background:var(--c);color:var(--t)}
.mapgrid .s i{font-style:normal}
/* 區域標題捲動時固定在上緣，才知道自己看的是哪一區 */
.mapgrid .lbl{font:700 12px/1 var(--id-font);color:var(--muted);text-align:center;padding-bottom:5px;
  letter-spacing:1px;position:sticky;top:0;z-index:3;background:var(--paper)}
.mapgrid .z{background:var(--c0);color:var(--t);border:1.5px dashed var(--c);border-radius:3px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  overflow:hidden;min-width:0;cursor:pointer;text-align:center;padding:1px}
.mapgrid .z b{font:800 12px/1 var(--id-font);color:var(--ink)}
.mapgrid .z em{font-style:normal;font-size:10px;line-height:1.1;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mapgrid.z-fit{gap:0}        /* 全區要塞進畫面，格線先省下來 */
.mapgrid.z-fit .s{font-size:0}
.mapgrid.z-fit .z b,.mapgrid.z-fit .z em,.mapgrid.z-mid .z em{display:none}
.mapgrid.z-mid .s{font-size:9px}
.mapgrid.z-mid .s i{display:none}
.mapgrid.z-mid .z b{font-size:11px}
.mapgrid.z-big .s{font-size:12px}
.mapgrid .rel{outline:2px dashed var(--hit);outline-offset:-1px;z-index:1}
.mapgrid .sel{outline:3px solid var(--hit);outline-offset:-1px;z-index:2}
.stub.zone{background:var(--muted)}
.list .sid.zn{font:700 15px/1 var(--body-font);color:var(--muted)}

/* 分頁 */
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 16px}
.tabs a{text-decoration:none;font:500 14px/1 var(--body-font);color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;padding:9px 14px}
.tabs a.on{background:var(--seat);color:var(--seat-ink);border-color:var(--seat);font-weight:700}
.tabs a:focus-visible{outline:2px solid var(--hit);outline-offset:2px}

/* 空白領域／留言板／美食設施共用的卡片 */
.cards{margin:0;padding:0;list-style:none}
.card{background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px}
.card h3{margin:0;font-size:17px;font-weight:700;overflow-wrap:anywhere}
.card .sub{font-size:13px;color:var(--muted);margin-top:2px}
/* pre-line：原表裡分行寫的活動時間表要保持分行，但多餘的空白還是收掉 */
.card .about{margin:8px 0 0;font-size:15px;overflow-wrap:anywhere;white-space:pre-line}
.card .none{margin:8px 0 0;font-size:14px;color:var(--muted)}
.card .row{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-top:8px}
.card .hours{font:600 14px/1.4 var(--body-font);color:var(--hit);overflow-wrap:anywhere}
.card button{all:unset;cursor:pointer;font:500 13px/1 var(--body-font);color:var(--ink);
  border:1.5px solid var(--line);border-radius:999px;padding:7px 12px}
.card button:focus-visible{outline:2px solid var(--hit);outline-offset:1px}
.card .seatlink{font:800 20px/1 var(--id-font);color:var(--seat);text-decoration:none}
.card .seatlink:focus-visible{outline:2px solid var(--hit)}
.grouphead{font-size:13px;color:var(--muted);margin:14px 0 6px;letter-spacing:1px}
.grouphead:first-child{margin-top:0}
.intro{font-size:14px;color:var(--muted);margin:0 0 12px}

.list{margin:12px 0;padding:0;list-style:none}
.list button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;background:var(--paper);border:1.5px solid var(--line);border-radius:var(--radius);margin-bottom:6px}
.list button:focus-visible{outline:3px solid var(--hit)}
.list .sid{font:800 22px/1 var(--id-font);color:var(--seat);min-width:4.2em}
.list .n{overflow-wrap:anywhere}
.empty-state{padding:18px 0;color:var(--muted)}
.banner{background:var(--paper);border:1.5px dashed var(--muted);border-radius:var(--radius);
  padding:10px 12px;font-size:14px;line-height:1.6;margin:10px 0 0}
.banner code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;
  background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:1px 5px;overflow-wrap:anywhere}
.src{display:inline-block;margin-top:10px;font-size:14px;color:var(--ink)}
footer{margin-top:40px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
footer a{color:inherit}
@media (prefers-reduced-motion:no-preference){.ticket{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:.4}}}
@media (max-width:420px){.stub{min-width:92px;padding:12px}.stub .id{font-size:42px}}
</style>
</head>
<body>
<main>
  <header>
    <h1>WirForce 2026<span>BYOC 座位查詢</span></h1>
    <p>輸入玩家暱稱或座位編號，找到他坐哪、隔壁和對面是誰。也可以用團名找空白領域營區。</p>
  </header>

  <nav class="tabs" id="tabs" aria-label="頁面">
    <a href="/" data-view="seat">座位查詢</a>
    <a href="/zones" data-view="zones">空白領域</a>
    <a href="/board" data-view="board">留言板</a>
    <a href="/food" data-view="food">美食與設施</a>
  </nav>

  <section id="view-seat">
  <div class="search" role="search">
    <label for="q">暱稱、座位編號或空白領域團名</label>
    <input id="q" type="search" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="例如：奶油、A24、放影旅團">
    <div class="status" id="status" aria-live="polite">載入座位資料中…</div>
  </div>

  <div id="notice"></div>

  <div class="mapbar">
    <button id="mapToggle" class="btn" type="button" aria-expanded="false" aria-controls="map" disabled>
      看全區地圖</button>
  </div>

  <section class="mapwrap" id="map" hidden aria-label="BYOC 全區座位相對位置圖">
    <div class="maptools">
      <div class="zoom" role="group" aria-label="地圖縮放">
        <button type="button" data-zoom="fit" class="on">全區</button>
        <button type="button" data-zoom="mid">中</button>
        <button type="button" data-zoom="big">大</button>
      </div>
      <div class="jump" id="mapJump" role="group" aria-label="跳到區域"></div>
      <p class="legend" id="mapLegend"></p>
    </div>
    <div class="mapscroll" id="mapScroll"><div class="mapgrid" id="mapGrid"></div></div>
  </section>

  <div id="out"></div>
  </section>

  <section id="view-zones" hidden></section>
  <section id="view-board" hidden></section>
  <section id="view-food" hidden></section>

  <footer>
    座位資料整理自社群維護的
    <a id="sheetLink" target="_blank" rel="noopener">WirForce 2026 座位表</a>，
    以原表為準。暱稱是玩家自行登記的，若找不到可能還沒登記或版面剛改過。
  </footer>
</main>

let DATA = null, BY_ID = {}, ROW_OF = {}, BY_ZONE = {}, NOTES_OF = {};
const $q = document.getElementById("q"), $out = document.getElementById("out"),
      $st = document.getElementById("status"), $notice = document.getElementById("notice");

const norm = s => (s || "").normalize("NFKC").toLowerCase().replace(/\s+/g, "");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
// 座位編號一律 1 英文 + 4 數字，不足補 0（打 a24、A024、A0024 都找得到 A0024）
const padId = id => { const m = /^\s*([A-Za-z])\s*0*(\d{1,4})\s*$/.exec(id || "");
  return m ? m[1].toUpperCase() + String(+m[2]).padStart(4, "0") : id; };
const seatIdOf = q => { const m = norm(q).match(/^([a-z])0*(\d{1,4})$/); if (!m) return null;
  return m[1].toUpperCase() + String(+m[2]).padStart(4, "0"); };

// 舊版 seats.json（A01 這種）可能還躺在 localStorage 快取裡，載入時一律補成 4 碼
function padAllIds(d){
  const one = v => Array.isArray(v) ? v.map(padId) : (v ? padId(v) : v);
  d.seats.forEach(s => {
    s.id = padId(s.id);
    ["opposite", "behind", "left", "right"].forEach(k => { s[k] = s[k] ? padId(s[k]) : s[k]; });
    s.partner = one(s.partner);
  });
  (d.rows || []).forEach(r => { r.seats = r.seats.map(padId); });
  return d;
}

function useData(d, note){
  DATA = d = padAllIds(d); BY_ID = {}; ROW_OF = {}; BY_ZONE = {}; NOTES_OF = {};
  d.seats.forEach(s => { BY_ID[s.id] = s; s._n = norm(s.name); });
  d.rows.forEach(r => r.seats.forEach(id => ROW_OF[id] = r));
  (d.zones || []).forEach(z => { BY_ZONE[z.no] = z; z._n = norm(`${z.label}${z.name}空白領域${z.no}`); });
  // 備註欄就是每個座位的介紹／活動，依座位編號建索引，座位頁直接取用
  (d.notes || []).forEach(n => {
    if (!n.seat) return;
    n.seat = padId(n.seat);
    (NOTES_OF[n.seat] = NOTES_OF[n.seat] || []).push(n);
  });
  $st.textContent = `${d.occupied} 位玩家已登記，資料更新於 ${d.generated_at}` + (note ? `（${note}）` : "");
  $q.disabled = false;
  $mapToggle.disabled = false;
  if (MAP.built){ MAP.built = false; MAP.cells = {}; buildMap(); }  // 換資料後重畫
  route(location.pathname, false);     // 由 route 決定要顯示哪一頁（含 /seat/A0024 與 ?q=）
}

async function load(){
  try{
    // 一定要用根目錄路徑：在 /seat/A0024 這種頁面上，相對的 "seats.json" 會變成 /seat/seats.json
    const r = await fetch("/seats.json", {cache:"no-cache"});
    if (!r.ok) throw new Error(r.status);
    const d = await r.json();
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(d)); }catch(e){}
    useData(d);
  }catch(e){
    let cached = null;
    try{ cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }catch(_){}
    if (cached){
      $notice.innerHTML = `<div class="banner">目前連不上網路，顯示的是上次下載的座位資料。</div>`;
      useData(cached, "目前連不上網路，顯示上次下載的資料"); return;
    }
    // 直接用檔案總管點開 index.html 時，瀏覽器不准網頁讀同資料夾的 seats.json，
    // 只會退到範例資料（只有 A 區），所以要講清楚是怎麼回事、怎麼解決
    const isFile = location.protocol !== "http:" && location.protocol !== "https:";
    $notice.innerHTML = `<div class="banner">` + (isFile
      ? `<b>現在顯示的是範例資料，只有 A 區一小塊。</b><br>
         瀏覽器不允許「直接點開的網頁」讀取同資料夾的 <code>seats.json</code>。
         要看完整的 A／B／C 三區與空白領域，請在這個資料夾起一個本機伺服器：<br>
         <code>python -m http.server 8000</code><br>再開 <code>http://localhost:8000</code>。`
      : `<b>讀不到 seats.json，現在顯示的是範例資料，只有 A 區一小塊。</b><br>
         請確認 <code>seats.json</code> 和 <code>index.html</code> 放在一起，
         或重跑一次 <code>python build_seats.py --sheet-id …</code>。`) + `</div>`;
    useData(DEMO, "範例資料");
  }
}

function run(q, push = true){
  if (push){
    const u = new URL(location);
    u.pathname = "/";        // 從 /seat/A0024 再打字時要回查詢頁，不要變成 /seat/A0024?q=…
    q ? u.searchParams.set("q", q) : u.searchParams.delete("q");
    history.replaceState(null, "", u);
  }
  if (!DATA) return;
  setTitle();                 // 離開某個座位頁了，標題先收回來，showSeat／showZone 會再設
  const nq = norm(q);
  if (!nq){ $out.innerHTML = ""; return; }
  const sid = seatIdOf(q);
  if (sid && BY_ID[sid]) return showSeat(sid);
  // 暱稱搜尋：大桌兩個座位是同一人，只列一次
  const seen = new Set(), hits = [];
  for (const s of DATA.seats){
    if (!s._n || !s._n.includes(nq)) continue;
    const key = s.name + "|" + (s.big ? [s.id, s.partner].flat().sort().join() : s.id);
    if (seen.has(key)) continue; seen.add(key); hits.push(s);
  }
  hits.sort((a, b) => (a._n === nq ? -1 : 0) - (b._n === nq ? -1 : 0) || a._n.length - b._n.length);
  // 空白領域是營區，沒有座位編號，用團名或「空白領域3」找得到
  const zhits = (DATA.zones || []).filter(z => z._n.includes(nq));
  if (!hits.length && zhits.length === 1) return showZone(zhits[0].no);
  if (hits.length === 1 && !zhits.length) return showSeat(hits[0].id);
  if (!hits.length && !zhits.length){
    $out.innerHTML = `<p class="empty-state">找不到「${esc(q)}」。試試暱稱的一部分、座位編號（例如 A24），或空白領域的團名。</p>`;
    return;
  }
  $out.innerHTML = `<ul class="list">${zhits.map(z => `
    <li><button data-zone="${z.no}"><span class="sid zn">營區</span><span class="n">${z.label}　${esc(z.name)}</span></button></li>`).join("")}
    ${hits.slice(0, 40).map(s => `
    <li><button data-id="${s.id}"><span class="sid">${s.id}${s.big ? "+" : ""}</span><span class="n">${esc(s.name)}</span></button></li>`).join("")}</ul>
    ${hits.length > 40 ? `<p class="empty-state">還有 ${hits.length - 40} 筆，請多打幾個字。</p>` : ""}`;
}

// 空白領域：只有營區名稱，沒有座位、也沒有對面背後
function showZone(no){
  const z = BY_ZONE[no]; if (!z) return;
  setTitle(`${z.label}　${z.name}`);
  $out.innerHTML = `
  <article class="ticket" aria-label="${z.label} 資訊">
    <div class="stub zone"><div class="id">${String(z.no).padStart(2, "0")}</div><div class="sub">空白領域</div></div>
    <div class="info">
      <p class="name">${esc(z.name)}</p>
      <div class="tags"><span class="tag">營區，原表沒有給座位編號</span></div>
      ${srcLink(z.cell)}
    </div>
  </article>`;
  markMap(null, no);
}

const seatLink = id => `<a href="/seat/${id}" data-seat="${id}">${id}</a>`;

function who(id){
  if (!id) return null;
  const s = BY_ID[id]; if (!s) return null;
  return `${seatLink(id)}　${s.name ? esc(s.name) : "<span style='color:var(--muted)'>未登記</span>"}`;
}

/* 每個座位都有自己的一頁：/seat/A0024。
   nav 決定要不要動網址："push" = 使用者點進來的（上一頁要回得去），
   "replace" = 打字查出來的（不要把歷史塞滿），null = 本來就是從這個網址進來的。 */
function showSeat(id, nav = "replace"){
  const s = BY_ID[id];
  if (!s) return showNoSeat(id, nav);
  const partners = [s.partner].flat().filter(Boolean);
  const neighbours = [s.left, s.right].filter(x => x && !partners.includes(x));
  const rows = [
    ["同桌", partners.length ? partners.map(seatLink).join("、") + "（大桌）" : null],
    ["對面", who(s.opposite)],
    ["隔壁", neighbours.map(who).filter(Boolean).join("<br>") || null],
    ["背後", who(s.behind)],
  ].filter(r => r[1]);
  $out.innerHTML = `
  <article class="ticket" aria-label="${id} 座位資訊">
    <div class="stub"><div class="id">${id}</div><div class="sub">${s.area} 區第 ${s.row_no} 排</div></div>
    <div class="info">
      <p class="name ${s.name ? "" : "empty"}">${s.name ? esc(s.name) : "這個位置還沒有人登記"}</p>
      <div class="tags">
        ${s.big ? `<span class="tag">大桌 ${[id, ...partners].sort().join("+")}</span>` : ""}
        <span class="tag">${s.facing}</span>
      </div>
      <ul class="near">${rows.map(([k, v]) => `<li><b>${k}</b><span>${v}</span></li>`).join("")}</ul>
      ${srcLink(s.cell)}
    </div>
    ${seatAbout(s)}
    ${tableMap(s)}
  </article>`;
  const hit = $out.querySelector(".cell.hit");
  if (hit) hit.scrollIntoView({block:"nearest", inline:"center"});
  if (nav) setPath(`/seat/${id}`, nav === "push");
  setTitle(shareTitle(s));
  markMap(id);
}

/* 這個座位的介紹與活動：玩家寫在原表「備註」欄的內容。
   大桌兩個編號是同一個人，兩邊的備註都算在這一頁。 */
function seatAbout(s){
  const notes = [s.id, ...[s.partner].flat().filter(Boolean)].flatMap(id => NOTES_OF[id] || []);
  const body = notes.length ? notes.map(n => `
      <div class="note">
        <p class="about">${esc(n.text)}</p>
        <p class="by">${esc(n.name || s.name || "")}${n.seat !== s.id ? `（寫在同桌的 ${n.seat}）` : ""}</p>
        <div class="row">${srcLink(n.cell, DATA.notes_sheet)}</div>
      </div>`).join("")
    : `<p class="none">這個座位還沒有介紹。在原座位表自己那一列的「備註」欄寫字，
       30 分鐘內就會出現在這裡。</p>`;
  return `<section class="seat-about" aria-label="${s.id} 的介紹與活動">
    <h3>介紹與活動</h3>${body}
    <div class="row">
      ${navigator.share ? `<button class="linkbtn share" type="button" data-share="/seat/${s.id}"
        data-title="${esc(shareTitle(s))}">分享我的座位</button>` : ""}
      <button class="linkbtn" type="button" data-copy="/seat/${s.id}">複製這頁連結</button>
      <input class="plainlink" type="text" readonly hidden aria-label="這個座位頁的網址">
    </div>
  </section>`;
}

// 網址上的編號原表沒有（打錯字，或那個號碼被障礙物佔掉了）
function showNoSeat(id, nav){
  if (nav) setPath(`/seat/${id}`, nav === "push");
  setTitle(`找不到 ${id}`);
  $out.innerHTML = `<p class="empty-state">找不到座位 <b>${esc(id)}</b>。
    原表可能沒有這個編號（有些號碼本來就被障礙物佔掉了），或是編號打錯了。
    上面的搜尋框可以用暱稱或別的編號再找一次。</p>`;
  markMap(null);
}

// 畫出這個座位所在的整張桌子（兩排面對面），版面照原表
function tableMap(s){
  const mine = ROW_OF[s.id]; if (!mine) return "";
  const other = s.opposite ? ROW_OF[s.opposite] : null;
  const pair = [mine, other].filter(Boolean).sort((a, b) => a.r - b.r);
  const hitSet = new Set([s.id, ...[s.partner].flat().filter(Boolean)]);

  // 兩排的座位數常常不一樣（障礙物把其中一排截短），所以一律用原表的欄位定位：
  //   各自從第 1 格排起 → 對面會對到錯的人
  //   讓格子自動流動     → 短的那排會接在上一行後面然後換行（C0056 就是這樣歪掉的）
  const colOf = id => colOfCell(BY_ID[id].cell);
  const cols = pair.flatMap(r => r.seats.map(colOf));
  const c0 = Math.min(...cols), width = Math.max(...cols) - c0 + 1;
  const at = (id, gr, span) =>
    `grid-row:${gr};grid-column:${colOf(id) - c0 + 1}${span > 1 ? `/span ${span}` : ""}`;

  const idLine = (row, gr) => row.seats.map(id => {
    const c = BY_ID[id].color;
    return `<div class="cell ${hitSet.has(id) ? "hit" : ""}"
      style="${at(id, gr, 1)}${c ? `;background:${c}` : ""}">${id}</div>`;
  }).join("");

  const nameLine = (row, gr) => {
    let html = "", i = 0;
    while (i < row.seats.length){
      const x = BY_ID[row.seats[i]]; let span = 1;
      while (x.name && i + span < row.seats.length && BY_ID[row.seats[i + span]].name === x.name &&
             [x.partner].flat().includes(row.seats[i + span])) span++;
      const hit = row.seats.slice(i, i + span).some(id => hitSet.has(id));
      html += `<div class="nm ${hit ? "hit" : ""}" style="${at(row.seats[i], gr, span)}"
        title="${esc(x.name)}">${esc(x.name) || "&nbsp;"}</div>`;
      i += span;
    }
    return html;
  };

  let body = "", gr = 1;
  pair.forEach((row, k) => {
    if (k) body += `<div class="aisle" style="grid-row:${gr++};grid-column:1/-1"></div>`;
    // 面上排：編號在上、暱稱在下；面下排相反，兩排的暱稱都朝著桌子中間
    body += row.side > 0 ? idLine(row, gr) + nameLine(row, gr + 1)
                         : nameLine(row, gr) + idLine(row, gr + 1);
    gr += 2;
  });
  return `<div class="table-map"><h3>整張桌子（左右滑動）</h3>
    <div class="scroller"><div class="grid" style="grid-template-columns:repeat(${width},64px)">${body}</div></div></div>`;
}

/* ── 全區地圖 ───────────────────────────────────────────────────────────
   相對位置圖：格線直接沿用原表的列／欄，所以障礙物缺口、桌子之間的走道
   都會照原表的樣子留白，但它不是按實際場地比例畫的，也沒有方位。
   圖上只顯示「有人／空位」與原表的分區底色，暱稱要點下去才出現。        */
const $map = document.getElementById("map"), $mapGrid = document.getElementById("mapGrid"),
      $mapScroll = document.getElementById("mapScroll"), $mapToggle = document.getElementById("mapToggle");
const MAP = { built:false, cells:{}, zones:{}, cols:0, zoom:"fit", cur:null, curZone:null };
const ZOOM = { fit:0, mid:26, big:44 };   // 編號變成 4 碼，格子要夠寬才塞得下 A0252

// 座位在原表的位置就藏在 cell 裡（例如 CW9 → 第 9 列、第 101 欄）
const rowOfCell = c => +c.replace(/^[A-Z]+/, "");
const colOfCell = c => [...c.replace(/\d+$/, "")].reduce((n, ch) => n * 26 + ch.charCodeAt(0) - 64, 0);

const tone = hex => {                       // 底色 → 實色／淡色／文字色
  const n = parseInt((hex || "#9E8A66").slice(1), 16);
  const R = n >> 16 & 255, G = n >> 8 & 255, B = n & 255;
  return { c: hex || "#9E8A66", c0: `rgba(${R},${G},${B},.2)`,
           t: (R * 299 + G * 587 + B * 114) / 1000 > 140 ? "#2B1B10" : "#FFF6E6" };
};

function buildMap(){
  const pts = DATA.seats.map(s => ({ s, r: rowOfCell(s.cell), c: colOfCell(s.cell) }));
  const zones = DATA.zones || [];
  const seatRows = new Set(pts.map(p => p.r));
  // 範圍要含空白領域：它們在座位格線的上下方、有的還在左邊
  const r0 = Math.min(...pts.map(p => p.r), ...zones.map(z => z.r));
  const r1 = Math.max(...pts.map(p => p.r), ...zones.map(z => z.r1));
  const c0 = Math.min(...pts.map(p => p.c), ...zones.map(z => z.c0));
  const c1 = Math.max(...pts.map(p => p.c), ...zones.map(z => z.c1));
  MAP.cols = c1 - c0 + 1;

  // 有座位的列給整格高度，其餘（暱稱列、走道）只留細縫，缺口就照原表留白
  const rowSpec = [];
  for (let r = r0; r <= r1; r++) rowSpec.push(seatRows.has(r) ? "var(--cell)" : "var(--gap)");

  const band = {};
  MAP.first = {};
  for (const { s, c } of pts){
    const b = band[s.area] || (band[s.area] = [c, c]);
    if (c < b[0] || !MAP.first[s.area]) MAP.first[s.area] = s.id;   // 該區最左邊那一格，給「跳到區域」用
    b[0] = Math.min(b[0], c); b[1] = Math.max(b[1], c);
  }
  const areas = Object.keys(band).sort();
  let html = areas.map(a => {
    const [bc0, bc1] = band[a];
    return `<div class="lbl" style="grid-row:1;grid-column:${bc0 - c0 + 1}/span ${bc1 - bc0 + 1}">${a} 區</div>`;
  }).join("");

  html += pts.map(({ s, r, c }) => {
    const k = tone(s.color), label = `${s.id}　${s.name ? "已登記" : "空位"}`;
    return `<div class="s${s.name ? " on" : ""}" role="button" tabindex="-1" data-id="${s.id}"
      title="${label}" aria-label="${label}" style="grid-row:${r - r0 + 2};grid-column:${c - c0 + 1};
      --c:${k.c};--c0:${k.c0};--t:${k.t}"><i>${s.id[0]}</i>${s.id.slice(1)}</div>`;
  }).join("");

  html += zones.map(z => {
    const k = tone(z.color), label = `${z.label}　${z.name}`;
    return `<div class="z" role="button" tabindex="-1" data-zone="${z.no}"
      title="${label}" aria-label="${label}"
      style="grid-row:${z.r - r0 + 2}/span ${z.r1 - z.r + 1};grid-column:${z.c0 - c0 + 1}/span ${z.c1 - z.c0 + 1};
      --c:${k.c};--c0:${k.c0};--t:${k.t}"><b>${String(z.no).padStart(2, "0")}</b><em>${esc(z.name)}</em></div>`;
  }).join("");

  $mapGrid.style.gridTemplateColumns = `repeat(${MAP.cols},var(--cell))`;
  $mapGrid.style.gridTemplateRows = "auto " + rowSpec.join(" ");
  $mapGrid.innerHTML = html;
  MAP.cells = {}; MAP.zones = {};
  $mapGrid.querySelectorAll(".s").forEach(el => { MAP.cells[el.dataset.id] = el; });
  $mapGrid.querySelectorAll(".z").forEach(el => { MAP.zones[el.dataset.zone] = el; });
  document.getElementById("mapJump").innerHTML =
    areas.map(a => `<button type="button" data-jump="${a}">${a} 區</button>`).join("") +
    (zones.length ? `<button type="button" data-jump="Z">空白領域</button>` : "");
  document.getElementById("mapLegend").innerHTML =
    `共 <b>${DATA.total}</b> 席、<b>${DATA.occupied}</b> 席已登記（深色＝有人、淺色＝空位，底色沿用原表）
     ${zones.length ? `；<b>${zones.length}</b> 個空白領域營區（虛線框）` : ""}。相對位置圖，非實際比例。`;
  MAP.built = true;
  setZoom("fit");
  if (MAP.cur || MAP.curZone) markMap(MAP.cur, MAP.curZone);   // 打開地圖前就查過的，補上標記
}

function setZoom(z){
  let cell = ZOOM[z];
  if (z === "fit"){  // 整區塞進畫面寬度（扣掉 .mapscroll 左右各 12px 的 padding；全區沒有格線）
    cell = Math.max(3, Math.floor(($mapScroll.clientWidth - 24) / MAP.cols));
  }
  // 地圖變高會讓 .mapscroll 跟著變高，ResizeObserver 會再叫一次；沒變就不用重做
  if (z === MAP.zoom && $mapGrid.style.getPropertyValue("--cell") === cell + "px"
      && $mapGrid.className === "mapgrid z-" + z) return;
  // 換縮放前先記住畫面中心在整張圖的哪個比例，放大後才不會被丟回最左上角
  const was = { x: ($mapScroll.scrollLeft + $mapScroll.clientWidth / 2) / ($mapGrid.offsetWidth || 1),
                y: ($mapScroll.scrollTop + $mapScroll.clientHeight / 2) / ($mapGrid.offsetHeight || 1) };
  MAP.zoom = z;
  $mapGrid.style.setProperty("--cell", cell + "px");
  $mapGrid.style.setProperty("--gap", Math.max(2, Math.round(cell * .36)) + "px");
  $mapGrid.className = "mapgrid z-" + z;
  $map.querySelectorAll(".zoom button").forEach(b => b.classList.toggle("on", b.dataset.zoom === z));
  if ($map.hidden) return;
  const sel = $mapGrid.querySelector(".sel");
  if (sel) return centerCell(sel);                   // 有選取的就對準它
  $mapScroll.scrollLeft = was.x * $mapGrid.offsetWidth - $mapScroll.clientWidth / 2;
  $mapScroll.scrollTop = was.y * $mapGrid.offsetHeight - $mapScroll.clientHeight / 2;
}

// 跳到某一區（靠左對齊，看得到整區的開頭）
function jumpTo(key){
  if (!MAP.built) return;
  const el = key === "Z" ? MAP.zones[Object.keys(MAP.zones)[0]] : MAP.cells[MAP.first[key]];
  if (!el) return;
  if (MAP.zoom === "fit") setZoom("mid");            // 全區時整張都看得到，跳之前先放大
  const a = el.getBoundingClientRect(), b = $mapScroll.getBoundingClientRect();
  $mapScroll.scrollLeft += (a.left - b.left) - 10;
  $mapScroll.scrollTop += (a.top - b.top) - 10;
}

function centerCell(el){
  const a = el.getBoundingClientRect(), b = $mapScroll.getBoundingClientRect();
  $mapScroll.scrollLeft += (a.left + a.width / 2) - (b.left + b.width / 2);
  $mapScroll.scrollTop += (a.top + a.height / 2) - (b.top + b.height / 2);
}

// 把選到的座位和它的同桌／對面／背後／隔壁標出來（或標出選到的空白領域）
function markMap(id, zoneNo){
  MAP.cur = id; MAP.curZone = zoneNo ?? null;
  if (!MAP.built) return;
  $mapGrid.querySelectorAll(".sel,.rel").forEach(el => el.classList.remove("sel", "rel"));
  let el = null;
  if (zoneNo != null){
    el = MAP.zones[zoneNo];
  } else {
    const s = BY_ID[id]; if (!s) return;
    [s.opposite, s.behind, s.left, s.right, ...[s.partner].flat()]
      .filter(Boolean).forEach(x => MAP.cells[x] && MAP.cells[x].classList.add("rel"));
    el = MAP.cells[id];
  }
  if (!el) return;
  el.classList.add("sel");
  if (!$map.hidden) centerCell(el);
}

$mapToggle.addEventListener("click", () => {
  const open = $map.hidden;
  $map.hidden = !open;
  $mapToggle.textContent = open ? "關閉地圖" : "看全區地圖";
  $mapToggle.setAttribute("aria-expanded", String(open));
  if (!open) return;
  if (!MAP.built) buildMap(); else setZoom(MAP.zoom);
});

$map.addEventListener("click", e => {
  const z = e.target.closest("button[data-zoom]");
  if (z) return setZoom(z.dataset.zoom);
  const j = e.target.closest("button[data-jump]");
  if (j) return jumpTo(j.dataset.jump);
  const cell = e.target.closest(".s[data-id],.z[data-zone]");
  if (!cell) return;
  if (MAP.zoom === "fit"){ setZoom("big"); centerCell(cell); return; }  // 總覽時先放大，避免誤觸
  const q = cell.dataset.id || BY_ZONE[cell.dataset.zone].name;
  $q.value = q;
  if (cell.dataset.id) showSeat(cell.dataset.id, "push"); else run(q);
  $out.scrollIntoView({ block:"nearest" });
});

// 轉向、視窗變寬都要重算「全區」的格子大小
if (window.ResizeObserver){
  new ResizeObserver(() => { if (MAP.built && !$map.hidden && MAP.zoom === "fit") setZoom("fit"); })
    .observe($mapScroll);
} else {
  window.addEventListener("resize", () => {
    if (MAP.built && !$map.hidden && MAP.zoom === "fit") setZoom("fit");
  });
}

/* ── 分頁路由 ───────────────────────────────────────────────────────────
   後端把 /zones、/board、/food、/seat/A0024 都送同一份 index.html，
   路由在前端做。                                                        */
const VIEWS = { "": "seat", "/index.html": "seat", "/map": "seat",
                "/zones": "zones", "/board": "board", "/food": "food" };
const RENDER = {};
const SITE_TITLE = "WirForce 2026 BYOC 座位查詢";   // 不讀 document.title：座位頁的標題是 server 先寫好的
const setTitle = t => document.title = t ? `${t}｜${SITE_TITLE}` : SITE_TITLE;

// 每個座位一頁：/seat/A0024。手打的 /seat/a24 也收，進來後正規化成 4 碼。
const seatOfPath = key => { const m = /^\/seat\/([^/]+)$/.exec(key);
  return m ? seatIdOf(decodeURIComponent(m[1])) : null; };

function setPath(path, push){
  if (location.pathname === path && !location.search) return;
  history[push ? "pushState" : "replaceState"]({}, "", path);
}

function route(path, push = true){
  const key = path.replace(/\/+$/, "");
  const sid = seatOfPath(key);
  const view = sid ? "seat" : (VIEWS[key] ?? "seat");
  for (const v of ["seat", "zones", "board", "food"])
    document.getElementById("view-" + v).hidden = v !== view;
  document.querySelectorAll("#tabs a").forEach(a =>
    a.classList.toggle("on", a.dataset.view === view));
  if (push && location.pathname !== path) history.pushState({}, "", path);
  if (RENDER[view]) RENDER[view]();
  if (key === "/map" && DATA && $map.hidden) $mapToggle.click();
  if (!DATA) return;                       // 資料還沒到，useData 進來時會再跑一次
  if (sid){                                // 網址本來就是這一頁；只有大小寫／補零要改才動它
    $q.value = sid;
    return showSeat(sid, key === `/seat/${sid}` ? null : "replace");
  }
  if (view !== "seat"){
    const tab = document.querySelector(`#tabs a[data-view="${view}"]`);
    return setTitle(tab ? tab.textContent.trim() : "");
  }
  const q = new URLSearchParams(location.search).get("q");
  if (q){ $q.value = q; return run(q, false); }
  $q.value = ""; $out.innerHTML = ""; setTitle(); markMap(null);
}

document.getElementById("tabs").addEventListener("click", e => {
  const a = e.target.closest("a[data-view]");
  if (!a || e.metaKey || e.ctrlKey || e.shiftKey) return;   // 讓「開新分頁」照常運作
  e.preventDefault();
  route(a.getAttribute("href"));
  window.scrollTo({ top: 0 });
});
window.addEventListener("popstate", () => route(location.pathname, false));

// 每張卡片的資料可能來自不同分頁（座位在地圖那張、留言在備註那張），gid 要跟著換
function sheetUrl(cell, sheetName){
  const gid = (DATA && DATA.gids && DATA.gids[sheetName ?? (DATA && DATA.sheet)]);
  const base = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
  if (gid == null) return base;
  return `${base}#gid=${gid}` + (cell ? `&range=${cell}` : "");
}
const srcLink = (cell, sheetName) =>
  `<a class="src" href="${sheetUrl(cell, sheetName)}" target="_blank" rel="noopener">在原座位表中查看</a>`;

/* 空白領域：14 個營區。介紹由維護者填在原表，目前多半還沒寫，有多少顯示多少。 */
RENDER.zones = () => {
  const box = document.getElementById("view-zones");
  const zones = (DATA && DATA.zones) || [];
  if (!zones.length) return box.innerHTML = `<p class="empty-state">這份座位表裡沒有空白領域資料。</p>`;
  const written = zones.filter(z => z.about).length;
  box.innerHTML = `<p class="intro">共 ${zones.length} 個營區。介紹由各營區自己填在原座位表，
    目前有 ${written} 則；原表補了什麼，這裡 30 分鐘內就會跟著更新。</p>
    <ul class="cards">${zones.map(z => `
      <li class="card">
        <h3>${esc(z.name)}</h3>
        <div class="sub">${z.label}</div>
        ${z.about ? `<p class="about">${esc(z.about)}</p>`
                  : `<p class="none">這個營區還沒有填介紹</p>`}
        <div class="row">
          <button data-zone="${z.no}">在地圖上看</button>
          ${srcLink(z.cell)}
        </div>
      </li>`).join("")}</ul>`;
};

/* 留言板：玩家寫在自己座位旁邊的備註 */
RENDER.board = () => {
  const box = document.getElementById("view-board");
  const notes = (DATA && DATA.notes) || [];
  if (!notes.length) return box.innerHTML = `<p class="empty-state">目前還沒有人留言。
    在原座位表自己座位那列的「備註」欄寫字，就會出現在這裡。</p>`;
  box.innerHTML = `<p class="intro">${notes.length} 則留言，來自原座位表的「備註」欄。
    想留言就在原表自己座位那一列寫，30 分鐘內會出現在這裡。</p>
    <ul class="cards">${notes.map(n => `
      <li class="card">
        <div class="row">
          ${n.seat && BY_ID[n.seat] ? `<a class="seatlink" href="/seat/${n.seat}" data-seat="${n.seat}">${n.seat}</a>` : ""}
          <strong>${esc(n.name || (n.seat ? "" : "（沒有填座位）"))}</strong>
        </div>
        <p class="about">${esc(n.text)}</p>
        <div class="row">${srcLink(n.cell, DATA.notes_sheet)}</div>
      </li>`).join("")}</ul>`;
};

/* 美食與設施：原表場地圖上的招牌，含營業時間 */
RENDER.food = () => {
  const box = document.getElementById("view-food");
  const places = (DATA && DATA.places) || [];
  if (!places.length) return box.innerHTML = `<p class="empty-state">這份座位表裡沒有標出吃喝或設施。</p>`;
  const split = p => {                       // 招牌文字前半是名字、從第一個時間起是細節
    const m = /^(.*?)(\d{1,2}[:：]\d{2}[\s\S]*)$/.exec(p.name);
    return m ? [m[1].trim(), m[2].trim()] : [p.name, ""];
  };
  const group = (kind, title) => {
    const list = places.filter(p => p.kind === kind);
    if (!list.length) return "";
    return `<p class="grouphead">${title}</p><ul class="cards">${list.map(p => {
      const [name, detail] = split(p);
      return `<li class="card">
        <h3>${esc(name)}</h3>
        ${detail ? `<p class="hours">${esc(detail)}</p>` : ""}
        <div class="row">${srcLink(p.cell)}</div>
      </li>`; }).join("")}</ul>`;
  };
  box.innerHTML = `<p class="intro">整理自原座位表場地圖上的招牌，營業時間以現場公告為準。</p>
    ${group("food", "吃喝")}${group("facility", "設施")}`;
};

// 卡片上的「在地圖上看」與座位連結（只掛新頁面，#out 有自己的 handler）
const cardClick = e => {
  const z = e.target.closest("button[data-zone]");
  if (z){
    route("/"); showZone(+z.dataset.zone);
    if ($map.hidden) $mapToggle.click();      // 開圖時會從 MAP.curZone 補上標記
    window.scrollTo({ top: 0 });
    return;
  }
  const s = e.target.closest("a[data-seat]");
  if (s && !e.metaKey && !e.ctrlKey && !e.shiftKey){
    e.preventDefault(); route(`/seat/${s.dataset.seat}`);
    window.scrollTo({ top: 0 });
  }
};
for (const v of ["zones", "board", "food"])
  document.getElementById("view-" + v).addEventListener("click", cardClick);

let t;
$q.addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => run(e.target.value), 120); });
$out.addEventListener("click", e => {
  const sh = e.target.closest("button[data-share]");
  if (sh) return shareLink(sh);
  const c = e.target.closest("button[data-copy]");
  if (c) return copyLink(c);
  const a = e.target.closest("a[data-seat]");
  if (a && !e.metaKey && !e.ctrlKey && !e.shiftKey){   // 讓「開新分頁」照常運作
    e.preventDefault();
    $q.value = a.dataset.seat; showSeat(a.dataset.seat, "push"); window.scrollTo({top:0});
    return;
  }
  const b = e.target.closest("button[data-id],button[data-zone]"); if (!b) return;
  if (b.dataset.id){ $q.value = b.dataset.id; showSeat(b.dataset.id, "push"); }
  else { const q = BY_ZONE[b.dataset.zone].name; $q.value = q; run(q); }
  window.scrollTo({top:0});
});

/* 分頁標題、分享文字、後端的社群預覽三個要長一樣，不然預覽有名字、點進去標題沒有，
   會閃一下。放自己的暱稱，不放鄰居的——見 AGENTS.md「曝光程度」那條。
   server.py 的 seat_meta() 是同一套規則，改這裡要一起改。 */
const shareTitle = s => `${s.id}　${s.name || `${s.area} 區第 ${s.row_no} 排`}`;

/* 系統分享選單。使用者按取消也會 reject，那不是錯誤，不要跳任何東西。 */
function shareLink(btn){
  const url = new URL(btn.dataset.share, location.href).href;
  navigator.share({ title: btn.dataset.title, text: btn.dataset.title, url })
    .catch(() => {});
}

/* 複製座位頁的網址。非 https、或使用者不給剪貼簿權限時都會失敗，
   那就把網址攤開選起來讓他自己複製 —— 手機瀏覽器這條路比 prompt() 可靠。 */
function copyLink(btn){
  const url = new URL(btn.dataset.copy, location.href).href;
  const done = () => {
    btn.textContent = "已複製連結";
    clearTimeout(btn._t); btn._t = setTimeout(() => btn.textContent = "複製這頁連結", 1600);
  };
  const show = () => {
    const i = btn.parentElement.querySelector(".plainlink");
    if (!i) return;
    i.hidden = false; i.value = url; i.focus(); i.select();
    btn.textContent = "這是連結，長按複製";
  };
  if (navigator.clipboard && window.isSecureContext)
    navigator.clipboard.writeText(url).then(done, show);
  else show();
}
$q.disabled = true;
load();
</script>
