# 每 10 分鐘從 Google Sheets 抓最新座位表 → 產生 seats.json → 部署到 GitHub Pages
name: 更新座位資料
on:
  schedule:
    - cron: "*/10 * * * *"   # GitHub 排程可能延遲幾分鐘；急的時候用手動觸發
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl==3.1.5
      - name: 產生 seats.json
        run: |
          mkdir -p site
          python build_seats.py --sheet-id "${{ vars.SHEET_ID }}" -o site/seats.json
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
